# Avahi daemon configuration for FabMo
# This is a minimal configuration optimized for direct ethernet connections

[server]
# Use hostname "fabmo" for mDNS
host-name=fabmo
# Use all available network interfaces
use-ipv4=yes
use-ipv6=no
# Allow interfaces to come and go
allow-interfaces=eth0,wlan0
# Deny specific interfaces (optional)
#deny-interfaces=

[wide-area]
enable-wide-area=no

[publish]
# Publish AAAA and A records for fabmo.local
publish-addresses=yes
publish-hinfo=yes
publish-workstation=yes
publish-domain=yes
# Don't publish anything we don't explicitly define
publish-a-on-ipv6=no
publish-aaaa-on-ipv4=no

[reflector]
enable-reflector=no

[rlimits]
# Resource limits (defaults are usually fine)
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3
